# Nixpacks configuration for Open Notebook API Service
# This file configures the Python/FastAPI backend deployment on Railway

[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "curl"]

[phases.install]
cmds = [
  "curl -LsSf https://astral.sh/uv/install.sh | sh",
  "export PATH=\"$HOME/.cargo/bin:$PATH\"",
  "uv sync --frozen --no-dev"
]

[phases.build]
cmds = []

[start]
cmd = "uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT"

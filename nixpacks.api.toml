# Nixpacks configuration for Open Notebook API Service
# This file configures the Python/FastAPI backend deployment on Railway

[phases.setup]
nixPkgs = ["python312", "curl"]

[phases.install]
cmds = [
  "curl -LsSf https://astral.sh/uv/install.sh | sh",
  ". $HOME/.cargo/env",
  "uv sync --frozen --no-dev"
]

[phases.build]
cmds = []

[start]
cmd = ". $HOME/.cargo/env && uv run --no-sync uvicorn api.main:app --host 0.0.0.0 --port $PORT"

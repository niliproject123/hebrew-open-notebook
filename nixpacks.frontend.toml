# Nixpacks configuration for Open Notebook Frontend Service
# This file configures the Next.js frontend deployment on Railway

[phases.setup]
nixPkgs = ["nodejs_20", "npm-10_x", "curl", "bash"]

[phases.install]
cwd = "frontend"
cmds = ["npm ci"]

[phases.build]
cwd = "frontend"
cmds = ["npm run build"]

[start]
cmd = "bash scripts/wait-for-api.sh && cd frontend && npm start"

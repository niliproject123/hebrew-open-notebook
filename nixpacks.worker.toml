# Nixpacks configuration for Open Notebook Worker Service
# This file configures the background job worker deployment on Railway

[phases.setup]
nixPkgs = ["python312", "curl"]

[phases.install]
cmds = [
  "curl -LsSf https://astral.sh/uv/install.sh | sh",
  ". $HOME/.cargo/env",
  "uv sync --frozen --no-dev"
]

[phases.build]
cmds = []

[start]
cmd = ". $HOME/.cargo/env && uv run --no-sync surreal-commands-worker --import-modules commands"
